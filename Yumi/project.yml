name: Yumi
options:
  bundleIdPrefix: app.yumi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      # DEVELOPMENT_TEAM: set before the first signed release
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/Yumi.entitlements

schemes:
  Yumi:
    build:
      targets:
        Yumi: all
        YumiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YumiTests
    archive:
      config: Release
  YumiAppStore:
    build:
      targets:
        YumiAppStore: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Yumi:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleIdentifier: app.yumi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Yumi reads the address of the page open in your browser to attach it as context, and sends the emails you confirm through Mail."
        # Not a key macOS reads: Accessibility consent is given in System Settings, with no custom text.
        # Kept as a record of why the app asks for it.
        NSAccessibilityUsageDescription: "Yumi reads the title of the frontmost window to attach it as context, and listens for Escape and your global shortcut."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi
        PRODUCT_NAME: Yumi
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

  YumiAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleIdentifier: app.yumi.appstore
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.appstore
        PRODUCT_NAME: Yumi
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/YumiAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE

  # Unit tests. Not hosted by the app: the files under test are compiled into the
  # bundle, so running the tests never launches Yumi (no socket, no Keychain, no window).
  # Only add files here that have no dependency on the rest of the app.
  YumiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/App/IslandStateMachine.swift
        group: Tests/UnderTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: ""
