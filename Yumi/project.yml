name: Yumi
options:
  bundleIdPrefix: app.yumi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      # DEVELOPMENT_TEAM is not set here: scripts/release.sh passes it from YUMI_TEAM_ID.
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/Yumi.entitlements

schemes:
  Yumi:
    build:
      targets:
        Yumi: all
        YumiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YumiTests
    archive:
      config: Release
  YumiAppStore:
    build:
      targets:
        YumiAppStore: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Yumi:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleIdentifier: app.yumi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Je lis l'adresse de la page ouverte dans ton navigateur quand tu me la montres, j'envoie par Mail ce que tu confirmes, et je mets ta musique en pause ou au morceau suivant quand tu me le demandes."
        # Not a key macOS reads: Accessibility consent is given in System Settings, with no custom text.
        # Kept as a record of why the app asks for it.
        NSAccessibilityUsageDescription: "Je lis le titre de la fenêtre que tu me montres, et j'écoute la touche Échap et ton raccourci."
        # Asked the first time the user presses the matching button of a module, never at launch.
        NSCalendarsFullAccessUsageDescription: "Je lis ton calendrier pour t'annoncer ton prochain rendez-vous. Rien ne quitte ton Mac."
        NSRemindersFullAccessUsageDescription: "Je te montre tes rappels du jour, et je coche ceux que tu termines."
        NSDownloadsFolderUsageDescription: "Je dépose dans Téléchargements les fichiers que tu me demandes de créer."
        NSDocumentsFolderUsageDescription: "Je travaille dans Documents si tu y as placé mon dossier."
        NSLocationWhenInUseUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
        NSLocationUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi
        PRODUCT_NAME: Yumi
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

  YumiAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleIdentifier: app.yumi.appstore
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
        # Asked the first time the user presses the matching button of a module, never at launch.
        NSCalendarsFullAccessUsageDescription: "Je lis ton calendrier pour t'annoncer ton prochain rendez-vous. Rien ne quitte ton Mac."
        NSRemindersFullAccessUsageDescription: "Je te montre tes rappels du jour, et je coche ceux que tu termines."
        NSDownloadsFolderUsageDescription: "Je dépose dans Téléchargements les fichiers que tu me demandes de créer."
        NSDocumentsFolderUsageDescription: "Je travaille dans Documents si tu y as placé mon dossier."
        NSLocationWhenInUseUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
        NSLocationUsageDescription: "Je regarde où tu es, au kilomètre près, pour te donner le ciel d'ici."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.appstore
        PRODUCT_NAME: Yumi
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/YumiAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE

  # Unit tests. Not hosted by the app: the files under test are compiled into the
  # bundle, so running the tests never launches Yumi (no socket, no Keychain, no window).
  # Only add files here that have no dependency on the rest of the app.
  # Core/, Modules/, Memory/ and Initiative/ as a whole follow that rule: nothing in them may use a view, AppState,
  # the hook server or a sound. Core/ knows nothing about Modules/ either.
  YumiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/App/IslandStateMachine.swift
        group: Tests/UnderTest
      - path: Sources/App/Core
      - path: Sources/App/Modules
      - path: Sources/App/Contracts/ModuleTypes.swift
        group: Tests/UnderTest
      - path: Sources/App/Contracts/ChatLive.swift
        group: Tests/UnderTest
      - path: Sources/App/Contracts/MemoryTypes.swift
        group: Tests/UnderTest
      - path: Sources/App/Memory
      - path: Sources/App/Initiative
      - path: Sources/App/Contracts/RemarkTypes.swift
        group: Tests/UnderTest
      - path: Sources/App/Contracts/CharacterCommands.swift
        group: Tests/UnderTest
      - path: Sources/App/AppIdentity.swift
        group: Tests/UnderTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: ""
