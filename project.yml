name: Yumi
options:
  bundleIdPrefix: app.yumi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Yumi:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: UI
      - path: Agents
      - path: Platform
      - path: Legacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Yumi
        CFBundleDisplayName: Yumi
        CFBundleIdentifier: app.yumi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yumi
