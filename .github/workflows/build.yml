name: Build

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd Yumi && xcodegen

      - name: Build
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme Yumi \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme Yumi \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # The App Store target is not shipped yet, but it must keep compiling (see YUMI.md).
      - name: Build App Store target
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme YumiAppStore \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
