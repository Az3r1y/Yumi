name: Un bug / A bug
description: Quelque chose ne marche pas comme prévu. Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Écris en français ou en anglais. Write in French or in English.
  - type: textarea
    id: passe
    attributes:
      label: Ce qui s'est passé / What happened
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que tu attendais / What you expected
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Les étapes pour le refaire / Steps to reproduce
      placeholder: |
        1. Ouvrir l'île / Open the island
        2. Cliquer sur... / Click on...
  - type: input
    id: version-yumi
    attributes:
      label: Version de Yumi / Yumi version
      description: Réglages, À propos. Settings, About.
      placeholder: 0.1.0-alpha
    validations:
      required: true
  - type: input
    id: version-macos
    attributes:
      label: Version de macOS / macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      description: Le modèle, et s'il a une notch. The model, and whether it has a notch.
      placeholder: "Mac15,3, notch : oui"
